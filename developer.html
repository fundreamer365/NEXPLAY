<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXPLAY — Developer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">NEXPLAY</a>
    <nav class="nav-links">
      <a href="index.html">Каталог</a>
      <a href="developer.html" class="active">Разработчикам</a>
    </nav>
    <div class="spacer"></div>
    <div id="authArea"></div>
  </div>
</header>

<main class="container">

  <div class="section">
    <h1 style="font-size:38px;margin:0 0 6px;letter-spacing:-0.02em">Developer Dashboard</h1>
    <p class="sub">Управляй играми, редактируй, обновляй билды.</p>
  </div>

  <section id="notAuth" class="hidden">
    <div class="empty"><p>Войди в NEXPLAY.</p><button class="btn btn-primary" onclick="location.href='index.html'">На главную</button></div>
  </section>

  <section id="becomeDev" class="hidden">
    <div class="empty"><p>Активируй роль разработчика.</p><button class="btn btn-primary" onclick="Dev.becomeDeveloper()">Стать разработчиком</button></div>
  </section>

  <section id="dashboard" class="hidden">
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" onclick="Dev.openCreate()">+ Создать игру</button>
      <button class="btn btn-lg" onclick="Dev.openNotifications()">🔔 Уведомления <span id="notifBadge" class="pill" style="display:none;background:var(--danger);color:#fff;border:none">0</span></button>
    </div>
    <h2 style="margin:24px 0 12px;font-size:22px">Мои игры</h2>
    <div class="grid" id="myGames"></div>
  </section>

</main>

<!-- CREATE / EDIT MODAL -->
<div class="modal-back" id="createModal">
  <div class="modal modal-tall" style="max-width:760px">
    <div class="modal-head">
      <div>
        <h3 id="createTitle">Новая игра</h3>
        <p class="sub">Заполни карточку игры.</p>
      </div>
      <button class="modal-x" onclick="Dev.closeCreate()">✕</button>
    </div>

    <div class="modal-scroll">
      <div class="form">
        <div class="row">
          <div class="field"><label>Название</label><input type="text" id="fTitle" placeholder="My Awesome Game"></div>
          <div class="field"><label>Slug (URL)</label><input type="text" id="fSlug" placeholder="my-awesome-game"></div>
        </div>
        <div class="field"><label>Имя разработчика / студии</label><input type="text" id="fDevName" placeholder="Indie Studio"></div>
        <div class="field"><label>Короткое описание</label><input type="text" id="fShort" maxlength="200"></div>
        <div class="field"><label>Полное описание</label><textarea id="fDesc" rows="5"></textarea></div>

        <div class="row">
          <div class="field">
            <label>Движок</label>
            <select id="fEngine" onchange="Dev.onEngineChange()">
              <option value="">— выбери —</option>
              <option value="unity">Unity</option>
              <option value="unreal">Unreal</option>
              <option value="other">Другое</option>
            </select>
          </div>
          <div class="field" id="unityBackendWrap" style="display:none">
            <label>Unity Backend</label>
            <select id="fUnityBackend"><option value="mono">Mono</option><option value="il2cpp">IL2CPP</option></select>
          </div>
          <div class="field" id="unrealVersionWrap" style="display:none">
            <label>Unreal версия</label><input type="text" id="fUnrealVersion" placeholder="5.3">
          </div>
        </div>

        <div class="row">
          <div class="field"><label>Возрастной рейтинг</label><input type="text" id="fAge" placeholder="12+"></div>
          <div class="field"><label>Дата выхода</label><input type="date" id="fRelease"></div>
        </div>

        <div class="field">
          <label>Теги (через запятую)</label>
          <input type="text" id="fTags" placeholder="Action, Indie">
          <div class="game-tags" id="tagSuggest" style="margin-top:8px"></div>
        </div>

        <div class="field"><label>Обложка (16:9)</label><input type="file" id="fCover" accept="image/*"></div>
        <div class="field"><label>Скриншоты</label><input type="file" id="fShots" accept="image/*" multiple><div class="shots" id="shotsPreview" style="margin-top:10px"></div></div>

        <div class="row">
          <div class="field"><label>Минимальные требования</label><textarea id="fSysMin" rows="4"></textarea></div>
          <div class="field"><label>Рекомендуемые требования</label><textarea id="fSysRec" rows="4"></textarea></div>
        </div>

        <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" id="fDrop" style="width:auto"> 🚀 NEXPLAY Drop</label>

        <div id="createError" class="hidden" style="color:var(--danger);font-size:13px"></div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="Dev.closeCreate()">Отмена</button>
      <button class="btn btn-primary" id="btnCreateSubmit" onclick="Dev.submitCreate()">Создать игру</button>
    </div>
  </div>
</div>

<!-- VERSION MODAL -->
<div class="modal-back" id="versionModal">
  <div class="modal modal-tall" style="max-width:680px">
    <div class="modal-head">
      <div><h3>Новая версия</h3><p class="sub">ZIP до 50 МБ или внешняя ссылка.</p></div>
      <button class="modal-x" onclick="Dev.closeVersion()">✕</button>
    </div>
    <div class="modal-scroll">
      <div class="form">
        <div class="row">
          <div class="field"><label>Версия</label><input type="text" id="vVersion" placeholder="1.0.0"></div>
          <div class="field"><label>EXE внутри архива</label><input type="text" id="vExe" placeholder="MyGame.exe"></div>
        </div>
        <div class="field"><label>Changelog</label><textarea id="vChangelog" rows="4"></textarea></div>
        <div class="field"><label>ZIP-билд</label><input type="file" id="vFile" accept=".zip,application/zip"></div>
        <div class="field"><label>…или внешняя ссылка</label><input type="url" id="vExternalUrl" placeholder="https://..."></div>
        <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" id="vPrimary" checked style="width:auto"> Главный билд</label>
        <div id="versionProgress" class="hidden">
          <div style="height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px">
            <div id="versionProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s"></div>
          </div>
          <div id="versionProgressText" style="font-size:13px;color:var(--muted);margin-top:6px"></div>
        </div>
        <div id="versionError" class="hidden" style="color:var(--danger);font-size:13px"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="Dev.closeVersion()">Отмена</button>
      <button class="btn btn-primary" id="btnVersionSubmit" onclick="Dev.submitVersion()">Опубликовать версию</button>
    </div>
  </div>
</div>

<!-- CROPPER -->
<div class="modal-back" id="cropperModal">
  <div class="modal" style="max-width:680px">
    <div class="modal-head">
      <div><h3>Обрезка обложки</h3><p class="sub">16:9</p></div>
      <button class="modal-x" onclick="Dev.closeCropper()">✕</button>
    </div>
    <div class="cropper-stage" id="cropperStage">
      <img id="cropperImg" alt="">
      <div class="cropper-overlay" id="cropperOverlay"><div class="cropper-handle" id="cropperHandle"></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="Dev.closeCropper()">Отмена</button>
      <button class="btn btn-primary" onclick="Dev.confirmCrop()">Готово</button>
    </div>
  </div>
</div>

<!-- NOTIF -->
<div class="modal-back" id="notifModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-head"><h3>Уведомления</h3><button class="modal-x" onclick="Dev.closeNotifications()">✕</button></div>
    <div id="notifList" style="max-height:60vh;overflow:auto;margin-top:12px"></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="Dev.closeNotifications()">Закрыть</button></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/developer.js"></script>
</body>
</html>
